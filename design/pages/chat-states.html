<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remcli — Чат — состояния</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08080A;display:flex;flex-direction:column;align-items:center;padding:32px 16px;font-family:Geist,sans-serif;}
@keyframes kBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes kPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes kBar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes kSpin{to{transform:rotate(360deg)}}
</style>
</head><body>
<!-- 1f Chat states -->
    <div id="1f" style="display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;align-items:baseline;gap:8px"><a href="#1f" style="font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 7px;background:#26262B;color:#FAFAFA;border-radius:5px;text-decoration:none">1f</a><span style="font-size:12px;color:#A1A1AA">Чат: диктовка · обрыв связи · завершение · TTS</span></div>
      <div style="width:390px;display:flex;flex-direction:column;gap:14px">
        <div style="background:#09090B;border:1px solid #26262B;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525B">поле ввода → диктовка (запись)</span>
          <div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-radius:12px;background:#131316;border:1px solid rgba(52,211,153,0.35)">
            <span style="width:9px;height:9px;border-radius:50%;background:#F87171;animation:kPulse 1s ease-in-out infinite;flex:none"></span>
            <div style="display:flex;align-items:center;gap:2.5px;height:22px;flex:1">
              <span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 0.9s ease-in-out infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 0.7s ease-in-out -0.2s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 1.1s ease-in-out -0.4s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 0.8s ease-in-out -0.1s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 1s ease-in-out -0.5s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 0.75s ease-in-out -0.3s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#34D399;animation:kBar 0.95s ease-in-out -0.6s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#2A9D74;animation:kBar 0.85s ease-in-out -0.15s infinite"></span><span style="width:3px;height:100%;border-radius:2px;background:#2A9D74;animation:kBar 1.05s ease-in-out -0.45s infinite"></span>
            </div>
            <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#FAFAFA">0:07</span>
            <button style="width:34px;height:34px;border-radius:9px;background:#F87171;border:none;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:11px;height:11px;border-radius:2px;background:#2D0A0A"></span></button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-radius:12px;background:#131316;border:1px solid #26262B">
            <span style="width:14px;height:14px;border-radius:50%;border:2px solid #26262B;border-top-color:#22D3EE;animation:kSpin 0.8s linear infinite;flex:none"></span>
            <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#A1A1AA">распознаём…</span>
            <span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:10px;color:#52525B">whisper · on-device</span>
          </div>
        </div>
        <div style="background:#09090B;border:1px solid #26262B;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525B">обрыв соединения · баннер под шапкой</span>
          <div style="display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;background:rgba(251,191,36,0.09);border:1px solid rgba(251,191,36,0.3)">
            <span style="width:12px;height:12px;border-radius:50%;border:2px solid rgba(251,191,36,0.25);border-top-color:#FBBF24;animation:kSpin 0.9s linear infinite"></span>
            <span style="font-family:'Geist Mono',monospace;font-size:11.5px;color:#FBBF24">соединение потеряно · переподключаем…</span>
            <span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:10px;color:#71717A">3s</span>
          </div>
          <div style="display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.3)">
            <svg width="12" height="12" viewBox="0 0 14 14"><path d="M2.5 7.5 L5.5 10.5 L11.5 4" stroke="#34D399" stroke-width="2" fill="none"/></svg>
            <span style="font-family:'Geist Mono',monospace;font-size:11.5px;color:#34D399">восстановлено · история догружена</span>
          </div>
        </div>
        <div style="background:#09090B;border:1px solid #26262B;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525B">сессия завершена</span>
          <div style="display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px;border-radius:12px;background:#0E0E11;border:1px dashed #26262B">
            <span style="font-family:'Geist Mono',monospace;font-size:11px;color:#71717A">— сессия завершена · exit 0 · 14:02 —</span>
            <div style="display:flex;gap:8px">
              <button style="height:38px;padding:0 15px;border-radius:9px;background:#FAFAFA;color:#09090B;font-size:13px;font-weight:600;border:none;font-family:Geist,sans-serif">↻ Продолжить</button>
              <button style="height:38px;padding:0 15px;border-radius:9px;background:transparent;color:#A1A1AA;font-size:13px;font-weight:500;border:1px solid #2E2E33;font-family:Geist,sans-serif">В список</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525B;flex:none">tts:</span>
            <button style="display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;background:transparent;border:1px solid #2E2E33;color:#A1A1AA;font-family:'Geist Mono',monospace;font-size:11px"><span style="width:11px;height:11px;border-radius:50%;border:2px solid #26262B;border-top-color:#34D399;animation:kSpin 0.8s linear infinite"></span>синтез…</button>
            <button style="display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border-radius:8px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.35);color:#34D399;font-family:'Geist Mono',monospace;font-size:11px"><span style="display:flex;align-items:flex-end;gap:2px;height:11px"><span style="width:2.5px;background:#34D399;height:100%;animation:kBar 0.8s ease-in-out infinite"></span><span style="width:2.5px;background:#34D399;height:100%;animation:kBar 0.6s ease-in-out -0.2s infinite"></span><span style="width:2.5px;background:#34D399;height:100%;animation:kBar 0.9s ease-in-out -0.4s infinite"></span></span>0:12 · стоп</button>
          </div>
        </div>
      </div>
    </div>
</body></html>
