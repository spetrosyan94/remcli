<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remcli — Command Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08080A;display:flex;flex-direction:column;align-items:center;padding:32px 16px;font-family:Geist,sans-serif;}
@keyframes kBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes kPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes kBar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes kSpin{to{transform:rotate(360deg)}}
</style>
</head><body>
<!-- 1j Command palette -->
    <div id="1j" style="display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;align-items:baseline;gap:8px"><a href="#1j" style="font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 7px;background:#26262B;color:#FAFAFA;border-radius:5px;text-decoration:none">1j</a><span style="font-size:12px;color:#A1A1AA">Command Palette · ⌘K / кнопка поиска</span></div>
      <div style="width:390px;height:844px;background:#09090B;border:1px solid #26262B;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative">
        <div style="position:absolute;inset:0;background:#09090B;opacity:0.55"></div>
        <div style="position:absolute;inset:0;backdrop-filter:blur(2px);background:rgba(0,0,0,0.35)"></div>
        <div style="position:absolute;left:14px;right:14px;top:76px;border-radius:16px;background:#131316;border:1px solid #2E2E33;box-shadow:0 24px 70px rgba(0,0,0,0.7);overflow:hidden">
          <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #1F1F23">
            <svg width="15" height="15" viewBox="0 0 15 15"><circle cx="6.5" cy="6.5" r="4.5" stroke="#71717A" stroke-width="1.6" fill="none"/><path d="M10 10 L13.5 13.5" stroke="#71717A" stroke-width="1.6"/></svg>
            <span style="font-size:15px;color:#FAFAFA">deplo</span><span style="display:inline-block;width:2px;height:18px;background:#34D399;animation:kBlink 1.1s steps(2) infinite"></span>
            <span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:10px;color:#52525B;padding:3px 7px;border:1px solid #26262B;border-radius:5px">esc</span>
          </div>
          <div style="padding:8px 6px">
            <div style="padding:6px 12px 4px;font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525B">сессии</div>
            <div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;background:#1E1E23">
              <span style="width:24px;height:24px;border-radius:7px;background:rgba(217,119,87,0.14);color:#E8916F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:10px;font-weight:700">cl</span>
              <span style="font-family:'Geist Mono',monospace;font-size:12.5px;color:#FAFAFA;flex:1">~/dev/<span style="color:#34D399">deplo</span>y-scripts</span>
              <span style="width:7px;height:7px;border-radius:50%;background:#FBBF24"></span>
              <span style="font-family:'Geist Mono',monospace;font-size:10px;color:#52525B">⏎</span>
            </div>
            <div style="padding:10px 12px 4px;font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525B">действия</div>
            <div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px">
              <span style="width:24px;height:24px;border-radius:7px;background:#1F1F23;color:#A1A1AA;display:flex;align-items:center;justify-content:center;font-size:13px">+</span>
              <span style="font-size:13px;color:#D4D4D8;flex:1">Новая сессия…</span>
              <span style="font-family:'Geist Mono',monospace;font-size:10px;color:#52525B">⌘N</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px">
              <span style="width:24px;height:24px;border-radius:7px;background:#1F1F23;color:#A1A1AA;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="13" rx="3" stroke="#A1A1AA" stroke-width="1.7" fill="none"/><path d="M5.5 7.5 L8 10 L5.5 12.5" stroke="#A1A1AA" stroke-width="1.7" fill="none"/></svg></span>
              <span style="font-size:13px;color:#D4D4D8;flex:1">Открыть терминал deploy-scripts</span>
              <span style="font-family:'Geist Mono',monospace;font-size:10px;color:#52525B">⌘T</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px">
              <span style="width:24px;height:24px;border-radius:7px;background:#1F1F23;color:#F87171;display:flex;align-items:center;justify-content:center"><span style="width:9px;height:9px;border-radius:2px;background:#F87171"></span></span>
              <span style="font-size:13px;color:#D4D4D8;flex:1">Остановить все сессии</span>
            </div>
          </div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:center"><span style="width:134px;height:5px;border-radius:3px;background:#3F3F46"></span></div>
      </div>
    </div>
  
</body></html>
