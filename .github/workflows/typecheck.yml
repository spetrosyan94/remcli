name: Web CI

on:
    pull_request:
        paths:
            - 'packages/remcli-web/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/typecheck.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/remcli-web/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/typecheck.yml'

jobs:
    web-checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: TypeScript typecheck
              run: npm -w remcli-web run typecheck

            - name: Unit tests
              run: npm -w remcli-web run test

            - name: Install Playwright browsers
              run: npm -w remcli-web exec -- playwright install --with-deps chromium

            - name: Fixture design gates
              run: npm -w remcli-web run test:e2e

            - name: Production build
              run: npm -w remcli-web run build
