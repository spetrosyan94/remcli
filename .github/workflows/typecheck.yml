name: Web CI

on:
    pull_request:
        paths:
            - 'packages/remcli-web/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/typecheck.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/remcli-web/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/typecheck.yml'

jobs:
    web-checks:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: TypeScript typecheck
              run: npm -w remcli-web run typecheck

            - name: Unit tests
              run: npm -w remcli-web run test

            - name: Install Playwright browsers
              run: npm -w remcli-web exec -- playwright install --with-deps chromium

            - name: Fixture design gates
              run: npm -w remcli-web run test:e2e

            - name: Production build
              run: npm -w remcli-web run build

    web-visual-gate:
        runs-on: ubuntu-24.04
        container:
            image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Design token contract
              run: npm -w remcli-web run test:design-contract

            - name: Visual and accessibility gate
              run: npm -w remcli-web run test:visual

            - name: Upload visual failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: remcli-web-visual-artifacts
                  if-no-files-found: ignore
                  path: |
                      packages/remcli-web/test-results/visual
                      packages/remcli-web/playwright-report/visual
